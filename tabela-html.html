<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Placar OBS — Tabela (HTML/CSS)</title>
<!--
  FASE 1 da reescrita canvas -> HTML/CSS.
  Arquivo standalone: NAO substitui nada no Placar.html. Abra como browser source
  do OBS (ou no navegador) para avaliar. Le o mesmo estado (api.php) e os mesmos
  dados (tabela/dados.js) do overlay atual.
-->
<style>
:root{
  /* tema "escuro" por padrao; trocado por JS conforme tabelaTema */
  --fg: 255,255,255;
  --dk: 8,14,24;
  --acc: #ffc400;
  --glow: 255,196,0;
  --bg: #080d15;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0}

/* ---------- HEADER ---------- */
.hdr{position:absolute;left:60px;top:42px;width:1800px;height:108px;border-radius:24px;
  background:rgba(var(--dk),.80);border:1px solid rgba(var(--fg),.07);
  display:flex;align-items:center;gap:20px;padding:0 26px}
.hdr .logo{width:66px;height:66px;object-fit:contain;flex:0 0 auto}
.hdr .logo[src=""]{display:none}
.live{display:flex;align-items:center;gap:9px;background:#e30613;color:#fff;
  font-weight:800;font-size:19px;padding:8px 19px;border-radius:26px;white-space:nowrap;
  animation:pulse 1.6s ease-in-out infinite}
.live .dot{width:10px;height:10px;border-radius:50%;background:#fff}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.hdrmain{display:flex;flex-direction:column;justify-content:center;min-width:0}
.hdrmain .ttl{font-weight:800;font-size:35px;line-height:1.05;color:rgba(var(--fg),.97);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdrmain .sub{font-weight:600;font-size:21px;color:rgba(var(--fg),.62);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .right{margin-left:auto;text-align:right;flex:0 0 auto}
.hdr .vname{font-weight:800;font-size:27px;color:rgba(var(--fg),.96)}
.hdr .vmeta{font-weight:600;font-size:22px;color:rgba(var(--fg),.78)}
.hdr .vbar{width:180px;height:3px;margin-left:auto;margin-top:6px;background:rgba(var(--glow),.85);border-radius:2px}

/* ---------- TABELA ---------- */
.tbl{position:absolute;left:84px;top:177px;width:1752px}
.grid{display:grid;
  grid-template-columns:70px 60px minmax(0,1fr) 100px 62px 62px 62px 62px 62px 62px 190px;
  align-items:center}
.thead{height:63px;border-radius:18px;
  background:rgba(var(--glow),.14);border:1px solid rgba(var(--glow),.38);
  font-weight:800;font-size:20px;letter-spacing:.5px;text-transform:uppercase;
  color:rgba(var(--fg),.82)}
.thead>div{padding:0 6px}
.tbody{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.row{height:41px;border-radius:12px;background:rgba(var(--fg),.05);
  border:1px solid rgba(var(--fg),.05);
  animation:rowIn .5s cubic-bezier(.22,.8,.3,1) both;animation-delay:calc(var(--i,0)*75ms)}
.row:nth-child(even){background:rgba(var(--fg),.10)}
.row.focus{background:rgba(var(--fg),.21);border-color:rgba(var(--fg),.42)}
.row>div{padding:0 6px;display:flex;align-items:center}
.c-pos{justify-content:center;font-weight:800;font-size:22px;color:rgba(var(--fg),.8)}
.c-crest{justify-content:center}
.c-crest .badge{width:33px;height:33px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:rgba(var(--fg),.85);overflow:hidden}
.c-crest img{width:33px;height:33px;object-fit:contain}
.c-name{font-weight:600;font-size:22px;color:rgba(var(--fg),.86);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block!important;
  padding-left:8px!important;align-self:center}
.row.focus .c-name{font-weight:800;color:rgba(var(--fg),.99)}
.num{justify-content:center;font-weight:600;font-size:21px;color:rgba(var(--fg),.7)}
.c-pts{justify-content:center;font-weight:900;font-size:26px;color:rgba(var(--fg),.95)}
.row.focus .c-pts{color:var(--acc)}
.c-form{justify-content:center;gap:6px}
.chip{width:27px;height:27px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#0a0f18}
.chip.G{background:#22c55e}.chip.E{background:#f59e0b}.chip.P{background:#ef4444}
@keyframes rowIn{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}

/* ---------- RODAPE ---------- */
.foot{position:absolute;left:84px;top:996px;font-weight:600;font-size:17px;color:rgba(var(--fg),.5)}

/* aviso quando sem conexao */
.off{position:fixed;right:14px;top:10px;font-size:14px;color:#fff;background:#b91c1c;
  padding:4px 10px;border-radius:6px;display:none}
</style>
</head>
<body>
<div id="off" class="off">sem conexão com api.php</div>
<div class="stage">
  <header class="hdr">
    <img class="logo" id="logo" src="" alt="">
    <div class="live"><span class="dot"></span>AO VIVO</div>
    <div class="hdrmain">
      <div class="ttl" id="ttl">QUARTA CATALANA</div>
      <div class="sub" id="sub">GRUP 18</div>
    </div>
    <div class="right">
      <div class="vname" id="vname"></div>
      <div class="vmeta" id="vmeta"></div>
      <div class="vbar"></div>
    </div>
  </header>

  <div class="tbl">
    <div class="thead grid">
      <div class="c-pos"></div>
      <div class="c-crest"></div>
      <div class="c-name">Equipe</div>
      <div class="c-pts">Pts</div>
      <div class="num">J</div><div class="num">V</div><div class="num">E</div>
      <div class="num">D</div><div class="num">F</div><div class="num">C</div>
      <div class="c-form">Últimos</div>
    </div>
    <div class="tbody" id="tbody"></div>
  </div>

  <div class="foot" id="foot">Fonte: fcf.cat · PTS=pontos, J=jogos, V/E/D=vitórias/empates/derrotas, F/C=gols pró/contra · cor da posição = zona · ordem por pontos e saldo de gols</div>
</div>

<script src="tabela/dados.js"></script>
<script>
(function () {
  'use strict';

  /* tokens css de cada tema (mesmos do motor canvas) */
  var THEMES = {
    escuro:    { fg:'255,255,255', dk:'8,14,24',   acc:'#ffc400', glow:'255,196,0', bg:'#080d15' },
    claro:     { fg:'14,26,45',    dk:'255,255,255', acc:'#d90429', glow:'217,4,41', bg:'#eef2f7' },
    neon:      { fg:'240,240,255', dk:'20,0,46',   acc:'#00e5ff', glow:'0,229,255', bg:'#0a0016' },
    broadcast: { fg:'12,32,58',    dk:'255,255,255', acc:'#124a8c', glow:'18,74,140', bg:'#f4f7fb' },
    matchfacts:{ fg:'255,255,255', dk:'9,12,17',   acc:'#e30613', glow:'227,6,19', bg:'#090c11' },
    aco:       { fg:'255,255,255', dk:'4,16,31',   acc:'#8fd0ff', glow:'130,200,255', bg:'#061528' },
    noturno:   { fg:'236,246,255', dk:'3,13,23',   acc:'#22d3ee', glow:'0,214,255', bg:'#020a12' }
  };
  var TEMA_PLACAR = { laliga:'escuro', colorido:'neon', simples:'matchfacts' };

  var API = 'api.php';
  try { var mi = location.search.match(/[?&]i=([^&]+)/); if (mi) API += '?i=' + encodeURIComponent(decodeURIComponent(mi[1].replace(/\+/g,' '))); } catch (e) {}
  var API_AND = API.indexOf('?') >= 0 ? '&' : '?';

  var DADOS = window.TABELA_DADOS || { teams: [] };

  function norm(s){ return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function initials(n){
    var w = String(n||'').replace(/[^\p{L}\s.]/gu,' ').split(/\s+/)
      .filter(function(x){ return x.length>1 && !/^(CLUB|FUTBOL|FUTBOLSALA|ASSOC\.?|ESP\.?|CF|CD|CE|UD|FC|A|B)$/i.test(x); });
    return (w.slice(0,2).map(function(x){return x[0];}).join('') || String(n||'?')[0] || '?').toUpperCase();
  }

  function aplicarTema(nome){
    var t = THEMES[nome] || THEMES.escuro;
    var r = document.documentElement.style;
    r.setProperty('--fg', t.fg); r.setProperty('--dk', t.dk);
    r.setProperty('--acc', t.acc); r.setProperty('--glow', t.glow); r.setProperty('--bg', t.bg);
  }

  var times = null;       // lista efetiva (estado.tabelaTimes ou DADOS.teams)
  var els = {
    ttl: document.getElementById('ttl'), sub: document.getElementById('sub'),
    vname: document.getElementById('vname'), vmeta: document.getElementById('vmeta'),
    logo: document.getElementById('logo'), tbody: document.getElementById('tbody'),
    foot: document.getElementById('foot'), off: document.getElementById('off')
  };

  function listarTimes(e){
    if (e.tabelaTimes) {
      try { var o = typeof e.tabelaTimes === 'string' ? JSON.parse(e.tabelaTimes) : e.tabelaTimes; if (o && o.length) return o; } catch (err) {}
    }
    return DADOS.teams || [];
  }

  function indice(e, chave, nome, padrao){
    var v = e[chave];
    if (v !== undefined && v !== '' && v !== 'auto' && !isNaN(parseInt(v))) {
      var n = parseInt(v); if (n >= 0 && n < times.length) return n;
    }
    var alvo = norm(nome); if (!alvo) return padrao;
    var melhor = null, peso = -1;
    for (var i = 0; i < times.length; i++) {
      var cands = [norm(times[i].name), norm(times[i].short)];
      for (var k = 0; k < cands.length; k++) {
        var c = cands[k]; if (!c) continue; var p = -1;
        if (c === alvo) p = 1000 + c.length;
        else if (alvo.length > 3 && c.indexOf(alvo) === 0) p = 500 + alvo.length;
        else if (alvo.length > 3 && c.indexOf(alvo) >= 0) p = 300 + alvo.length;
        else if (c.length > 3 && alvo.indexOf(c) >= 0) p = 200 + c.length;
        if (p > peso) { peso = p; melhor = i; }
      }
    }
    return peso > 0 ? melhor : padrao;
  }

  function render(e){
    times = listarTimes(e);

    /* tema */
    var tema = e.tabelaTema || 'auto';
    if (tema === 'auto') tema = TEMA_PLACAR[e.tema || 'laliga'] || 'escuro';
    aplicarTema(tema);

    /* header */
    var ttl = e.tabelaTitulo || e.competicao || (DADOS.comp || 'QUARTA CATALANA');
    var sub = e.tabelaSub || [e.grupo, e.categoria, e.fase].filter(Boolean).join(' · ') || (DADOS.grup || '');
    els.ttl.textContent = ttl; els.sub.textContent = sub;

    var logo = e.tabelaLogo || e.logoTorneio || '';
    els.logo.src = logo ? ('torneios/' + logo) : '';

    var vn = [e.tabelaLocal || e.local || ''].filter(Boolean).join(' ');
    els.vname.textContent = vn;
    els.vmeta.textContent = [e.tabelaHora || e.hora || '', e.clima ? (e.clima + '°C') : '', e.climaIcone || ''].filter(Boolean).join('   ·   ');

    /* destaque */
    var A = indice(e, 'tabelaA', e.timeA || e.siglaA, 0);
    var B = indice(e, 'tabelaB', e.timeB || e.siglaB, 1);

    /* zonas */
    var zonas = e.tabelaZonas !== 'false';
    var zUp = parseInt(e.tabelaZonaUp, 10) || 1;
    var zDn = parseInt(e.tabelaZonaDn, 10) || 14;
    var zcUp = e.tabelaZonaCorUp || '#22c55e';
    var zcDn = e.tabelaZonaCorDn || '#ef4444';

    /* linhas */
    var h = '';
    for (var i = 0; i < times.length; i++) {
      var tm = times[i], focus = (i === A || i === B);
      var posCol = '';
      if (zonas && tm.pos != null) {
        if (tm.pos <= zUp) posCol = zcUp;
        else if (tm.pos >= zDn) posCol = zcDn;
      }
      var crest = tm.crest
        ? '<img src="' + esc(tm.crest) + '" alt="" onerror="this.style.display=&quot;none&quot;;this.nextElementSibling.style.display=&quot;flex&quot;">'
          + '<span class="badge" style="display:none">' + esc(initials(tm.short || tm.name)) + '</span>'
        : '<span class="badge">' + esc(initials(tm.short || tm.name)) + '</span>';
      var chips = '';
      var form = tm.form || [];
      for (var f = 0; f < form.length; f++) {
        var g = String(form[f] || '').toUpperCase();
        var ico = g === 'G' ? 'V' : (g === 'E' ? 'E' : (g === 'P' ? 'D' : g));
        chips += '<span class="chip ' + esc(g) + '">' + esc(ico) + '</span>';
      }
      h += '<div class="row grid' + (focus ? ' focus' : '') + '" style="--i:' + i + '">'
         + '<div class="c-pos" style="' + (posCol ? ('color:' + posCol) : '') + '">' + esc(tm.pos) + '</div>'
         + '<div class="c-crest">' + crest + '</div>'
         + '<div class="c-name">' + esc(tm.short || tm.name) + '</div>'
         + '<div class="c-pts" data-pts="' + esc(tm.pts) + '">' + esc(tm.pts) + '</div>'
         + '<div class="num">' + esc(tm.j) + '</div>'
         + '<div class="num">' + esc(tm.g) + '</div>'
         + '<div class="num">' + esc(tm.e) + '</div>'
         + '<div class="num">' + esc(tm.p) + '</div>'
         + '<div class="num">' + esc(tm.f) + '</div>'
         + '<div class="num">' + esc(tm.c) + '</div>'
         + '<div class="c-form">' + chips + '</div>'
         + '</div>';
    }
    els.tbody.innerHTML = h;
    contarPontos();
  }

  /* contagem dos pontos (efeito de entrada) */
  function contarPontos(){
    var alvos = els.tbody.querySelectorAll('.c-pts[data-pts]');
    for (var i = 0; i < alvos.length; i++) {
      (function (el) {
        var fim = parseInt(el.getAttribute('data-pts'), 10) || 0;
        var ini = performance.now(), dur = 550;
        el.textContent = '0';
        function passo(now) {
          var p = Math.min(1, (now - ini) / dur);
          var e = 1 - Math.pow(1 - p, 3);
          el.textContent = String(Math.round(fim * e));
          if (p < 1) requestAnimationFrame(passo);
        }
        requestAnimationFrame(passo);
      })(alvos[i]);
    }
  }

  /* ---------- sincronizacao (mesmo polling do overlay) ---------- */
  var versao = 0, emAndamento = false;
  function sincronizar(){
    if (emAndamento) return;
    emAndamento = true;
    fetch(API + API_AND + 'v=' + versao)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        els.off.style.display = 'none';
        if (data._same) return;
        versao = parseInt(data.estadoVersao) || versao;
        /* buildFlat: junta as secoes num objeto plano */
        var flat = {};
        Object.keys(data).forEach(function (k) {
          var v = data[k];
          if (v && typeof v === 'object' && !Array.isArray(v)) Object.assign(flat, v);
          else flat[k] = v;
        });
        render(flat);
      })
      .catch(function () { els.off.style.display = 'block'; })
      .then(function () {
        emAndamento = false;
        setTimeout(sincronizar, 1000);
      });
  }

  /* primeira renderizacao com os dados locais (funciona ate em file://) */
  render({});
  sincronizar();
})();
</script>
</body>
</html>
